version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bingo-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"  # ⚠️ Port สำหรับ Development (ไม่ชนกับ PostgreSQL อื่น)

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: bingo_party
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # ถ้ามี Init Script

    networks:
      - bingo-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache & Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: bingo-redis
    restart: unless-stopped

    ports:
      - "6379:6379"  # ⚠️ Port สำหรับ Development

    command: redis-server --appendonly yes --requirepass redis_dev_password

    volumes:
      - redis_data:/data

    networks:
      - bingo-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # pgAdmin (Optional - Database Management UI)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bingo-pgadmin
    restart: unless-stopped

    ports:
      - "5050:80"  # เข้าได้ที่ http://localhost:5050

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bingo.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - bingo-network

    depends_on:
      - postgres

  # ===========================================================================
  # Redis Commander (Optional - Redis Management UI)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bingo-redis-commander
    restart: unless-stopped

    ports:
      - "8081:8081"  # เข้าได้ที่ http://localhost:8081

    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_dev_password

    networks:
      - bingo-network

    depends_on:
      - redis

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  bingo-network:
    driver: bridge

# =============================================================================
# คำสั่งการใช้งาน
# =============================================================================
#
# 1. เริ่มต้นทุก Services:
#    docker-compose up -d
#
# 2. ดู Logs:
#    docker-compose logs -f
#
# 3. หยุด Services:
#    docker-compose down
#
# 4. ลบข้อมูลทั้งหมด (⚠️ ระวัง! จะลบ Database):
#    docker-compose down -v
#
# 5. Restart Service เดียว:
#    docker-compose restart postgres
#
# 6. ตรวจสอบสถานะ:
#    docker-compose ps
#
# 7. เข้า PostgreSQL CLI:
#    docker exec -it bingo-postgres psql -U postgres -d bingo_party
#
# 8. เข้า Redis CLI:
#    docker exec -it bingo-redis redis-cli -a redis_dev_password
#
# =============================================================================
# Ports Summary
# =============================================================================
#
# Service               | Port  | URL
# ----------------------|-------|--------------------------------
# PostgreSQL            | 5432  | postgres://localhost:5432
# Redis                 | 6379  | redis://localhost:6379
# pgAdmin               | 5050  | http://localhost:5050
# Redis Commander       | 8081  | http://localhost:8081
# Backend API (Manual)  | 8001  | http://localhost:8001
# Backend WS (Manual)   | 8002  | ws://localhost:8002
# Frontend (Manual)     | 3000  | http://localhost:3000
#
# =============================================================================
# Environment Variables
# =============================================================================
#
# ตั้งค่าใน Backend (.env):
#
# DATABASE_URL="postgresql://postgres:postgres_dev_password@localhost:5432/bingo_party?schema=public"
# REDIS_URL="redis://:redis_dev_password@localhost:6379"
#
# =============================================================================
