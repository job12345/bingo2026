# =============================================================================
# Promtail Configuration
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ======================================
  # 1. System Logs
  # ======================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  # ======================================
  # 2. Docker Container Logs
  # ======================================
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

  # ======================================
  # 3. Backend Application Logs
  # ======================================
  - job_name: bingo-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          app: bingo-party
          __path__: /opt/bingo-party/bingo-backend/logs/*.log
